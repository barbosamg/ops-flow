name: opsflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${OPSFLOW_SQL_PASSWORD:?Set OPSFLOW_SQL_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - opsflow-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: >-
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - opsflow-azurite-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const n=require('net').connect(10001,'127.0.0.1');n.on('connect',()=>process.exit(0));n.on('error',()=>process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/OpsFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OpsFlow: Server=sqlserver,1433;Database=OpsFlow;User Id=sa;Password=${OPSFLOW_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Queues__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      Persistence__ApplyMigrationsOnStartup: "true"
      Persistence__SeedOnStartup: "true"
    ports:
      - "5153:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/OpsFlow.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__OpsFlow: Server=sqlserver,1433;Database=OpsFlow;User Id=sa;Password=${OPSFLOW_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      ProviderApi__BaseUrl: http://api:8080/
      Queues__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opsflow-sql-data:
  opsflow-azurite-data:
